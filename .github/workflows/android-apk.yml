name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name move64 --org app.move64 .
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml
      - name: Configure Android notification support
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path("android/app/build.gradle.kts")
          if p.exists():
              s=p.read_text()
              s=s.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11\n    }", 1)
              s=s.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")", 1) if "dependencies {" in s else s+"\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              p.write_text(s)
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          s=manifest.read_text()
          s=s.replace("<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">", "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />")
          s=s.replace("</application>", "    <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />\n    <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\">\n      <intent-filter>\n        <action android:name=\"android.intent.action.BOOT_COMPLETED\" />\n        <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />\n      </intent-filter>\n    </receiver>\n  </application>")
          manifest.write_text(s)
          PYCODE
      - name: Install dependencies
        run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MOVE64-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
